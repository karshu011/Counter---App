<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <link rel="stylesheet" href="counter.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <div class="top">
            <div class="logo">
                <span class="bar one"></span>
                <span class="bar two"></span>
                <span class="bar three"></span>
            </div>
            <div class="mode">
    <button id="light">
        <i class="fa-solid fa-sun"></i>
    </button>

    <button id="dark">
        <i class="fa-solid fa-moon"></i>
    </button>
</div>
        </div>

        <h1>Counter App</h1>
        <p class="subtitle">Small steps make big progress</p>
        <div class="counter-circle">
            <div id="count">0</div>
            <p>CURRENT COUNT</p>
        </div>
        <div class="buttons">

            <div class="btn">
                <button id="decrement">−</button>
                <h3>Decrement</h3>
            </div>

            <div class="btn">
                <button id="increment">+</button>
                <h3>Increment</h3>
            </div>

            <div class="btn">
                <button id="reset">↻</button>
                <h3>Reset</h3>
            </div>

        </div>
        <div class="quote">
            <span class="quote-mark">“</span>
            <p>Consistency turns small actions<br>
            into big results.</p>
        </div>

    </div>

    <div class="keep">
        Keep<br>Going
        <span>♡</span>
    </div>

    <script src="counter.js"></script>
</body>
</html>
